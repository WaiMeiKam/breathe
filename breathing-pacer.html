<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breathe">
<meta name="theme-color" id="theme-meta" content="#07090c">
<title>Breathe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,200;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root {
  --tt: 0.38s ease;
  --tz: 1.1s ease;
}

body.dark {
  --bg: #07090c;
  --surface: rgba(255,255,255,0.055);
  --surface-raised: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --fg: rgba(255,255,255,0.92);
  --fg-mid: rgba(255,255,255,0.55);
  --fg-low: rgba(255,255,255,0.28);
  --arc-track: rgba(255,255,255,0.07);
  --btn-fg: rgba(255,255,255,0.28);
  --panel-bg: #0d1014;
  --vignette: rgba(7,9,12,0.52);
  --overlay: rgba(0,0,0,0.55);
}

body.light {
  --bg: #ece9e3;
  --surface: rgba(0,0,0,0.05);
  --surface-raised: rgba(0,0,0,0.07);
  --border: rgba(0,0,0,0.09);
  --border-strong: rgba(0,0,0,0.18);
  --fg: rgba(0,0,0,0.88);
  --fg-mid: rgba(0,0,0,0.52);
  --fg-low: rgba(0,0,0,0.30);
  --arc-track: rgba(0,0,0,0.07);
  --btn-fg: rgba(0,0,0,0.26);
  --panel-bg: #e4e0da;
  --vignette: rgba(0,0,0,0);
  --overlay: rgba(0,0,0,0.30);
}

html { height:100%; }

body {
  width:100%; height:100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Mono', monospace;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  transition: background var(--tt), color var(--tt);
}

/* ─────────────────── APP SHELL ─────────────────── */
#app {
  position: relative;
  width:100%; height:100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding-top: max(24px, env(safe-area-inset-top, 24px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
}

/* ─────────────────── TOP BAR ─────────────────── */
#top {
  width:100%;
  padding: 0 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  opacity:0;
  animation: fadeUp 0.8s 0.1s forwards;
}

#top-left { display:flex; flex-direction:column; gap:6px; }

#zone-label {
  font-family: 'DM Mono', monospace;
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--accent, #40a882);
  transition: color var(--tz);
  line-height: 1;
}

#mouth-cue {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--fg-mid);
  text-transform: uppercase;
  transition: color var(--tt);
}

/* Settings trigger */
#settings-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-low);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color var(--tt), color var(--tt), transform 0.2s;
  flex-shrink: 0;
}
#settings-btn:active { transform: scale(0.90); }
#settings-btn svg { width:16px; height:16px; }

/* ─────────────────── CANVAS ─────────────────── */
#canvas-area {
  flex:1;
  width:100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#canvas-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
}

canvas { display:block; }

#arc-svg {
  position:absolute; inset:0;
  pointer-events:none; overflow:visible;
}
#arc-track { fill:none; stroke:var(--arc-track); stroke-width:1.5; transition:stroke var(--tt); }
#arc-fill  { fill:none; stroke-width:1.5; stroke-linecap:round; }

#breath-wrap {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  pointer-events:none;
  gap:5px;
}

#breath-verb {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 200; font-style: italic;
  font-size: clamp(38px, 10vw, 56px);
  letter-spacing: 0.03em;
  color: var(--fg);
  line-height:1;
  transition: opacity 0.15s ease, color var(--tt);
}

#breath-detail {
  font-size:10px; letter-spacing:0.22em;
  color: var(--fg-mid);
  text-transform:uppercase;
  transition: opacity 0.4s ease, color var(--tt);
}

#phase-timer {
  font-size:12px; letter-spacing:0.14em;
  color: var(--fg-low);
  font-variant-numeric: tabular-nums;
  margin-top:2px;
  transition: color var(--tt);
}

/* ─────────────────── BOTTOM ─────────────────── */
#bottom {
  width:100%;
  padding: 0 18px;
  display:flex; flex-direction:column; align-items:center;
  gap:16px;
  opacity:0;
  animation: fadeUp 0.8s 0.35s forwards;
}

/* Zone selector */
#zone-selector { display:flex; gap:7px; align-items:center; }

.zone-btn {
  position:relative;
  width:54px; height:54px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--btn-fg);
  font-family:'DM Mono',monospace;
  cursor:pointer;
  transition: border-color 0.28s, color 0.28s, box-shadow 0.28s;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:3px;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
.zone-btn .zn { font-size:14px; font-weight:400; line-height:1; }
.zone-btn .zt { font-size:8px; letter-spacing:0.10em; color:var(--fg-low); text-transform:uppercase; transition:color 0.28s; }

.zone-btn.active {
  border-color: var(--accent, #40a882);
  color: var(--accent, #40a882);
  box-shadow: 0 0 22px -6px var(--accent, #40a882), inset 0 0 14px -9px var(--accent, #40a882);
}
.zone-btn.active .zt { color:var(--accent,#40a882); opacity:0.65; }

.zone-btn .ripple {
  position:absolute; border-radius:50%;
  width:100%; height:100%;
  background:var(--accent,#40a882);
  opacity:0; transform:scale(0.2);
  animation:ripple 0.5s ease-out forwards;
  pointer-events:none;
}
@keyframes ripple { to { opacity:0; transform:scale(2.2); } }

/* HR row */
#hr-row {
  width:100%; display:flex; align-items:center; gap:10px; padding:0 2px;
}
#hr-label { font-size:9px; letter-spacing:0.22em; color:var(--fg-low); text-transform:uppercase; }
#hr-value-display { font-size:11px; letter-spacing:0.1em; color:var(--accent,#40a882); min-width:56px; transition:color var(--tz); }

#hr-slider {
  -webkit-appearance:none; appearance:none;
  flex:1; height:2px;
  background:var(--border); border-radius:2px;
  outline:none; cursor:pointer;
  transition:background var(--tt);
}
#hr-slider::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:22px; height:22px; border-radius:50%;
  background:var(--accent,#40a882); cursor:pointer;
  box-shadow:0 0 10px -2px var(--accent,#40a882);
  transition:background 0.4s, box-shadow 0.4s;
}
#hr-slider::-moz-range-thumb {
  width:22px; height:22px; border-radius:50%;
  background:var(--accent,#40a882); border:none; cursor:pointer;
}

#hr-clear {
  font-size:9px; letter-spacing:0.18em; color:var(--fg-low);
  cursor:pointer; text-transform:uppercase;
  background:none; border:none; padding:6px 2px;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s, color 0.3s;
  font-family:'DM Mono',monospace;
}
#hr-clear.visible { opacity:1; pointer-events:auto; }

/* ─────────────────── SETTINGS PANEL ─────────────────── */
/* Overlay backdrop */
#panel-overlay {
  position:fixed; inset:0; z-index:80;
  background: var(--overlay);
  opacity:0; pointer-events:none;
  transition: opacity 0.38s ease;
}
#panel-overlay.open { opacity:1; pointer-events:auto; }

/* Slide-up panel */
#settings-panel {
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:90;
  background: var(--panel-bg);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border-strong);
  padding: 0 0 max(28px, env(safe-area-inset-bottom, 28px));
  transform: translateY(110%);
  transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 88vh;
  overflow-y: auto;
}
#settings-panel.open { transform: translateY(0); }

/* Drag handle */
.panel-handle {
  width:40px; height:4px;
  background:var(--border-strong);
  border-radius:2px;
  margin: 16px auto 0;
}

/* Panel header */
.panel-header {
  display:flex; justify-content:space-between; align-items:center;
  padding: 20px 24px 0;
  margin-bottom: 28px;
}

.panel-title {
  font-size:11px; letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--fg-mid);
}

#panel-close {
  width:30px; height:30px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--fg-low);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition: color var(--tt), border-color var(--tt);
  font-size:14px; line-height:1;
}

/* Panel sections */
.panel-section {
  padding: 0 24px;
  margin-bottom: 28px;
}

.section-label {
  font-size:9px; letter-spacing:0.22em; text-transform:uppercase;
  color:var(--fg-low);
  margin-bottom:14px;
  display:block;
}

/* Shape picker */
#shape-picker {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
}

.shape-card {
  position:relative;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--surface);
  padding: 18px 16px 16px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition: border-color 0.28s, background 0.28s, box-shadow 0.28s;
  display:flex; flex-direction:column; gap:10px;
  overflow:hidden;
}

.shape-card.active {
  border-color: var(--accent,#40a882);
  background: var(--surface-raised);
  box-shadow: 0 0 24px -8px var(--accent,#40a882);
}

.shape-card-preview {
  width:100%; aspect-ratio:1;
  max-width:64px;
  margin:0 auto;
}

.shape-card-preview canvas {
  width:100% !important; height:100% !important;
}

.shape-card-name {
  font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--fg-mid);
  text-align:center;
  transition:color 0.28s;
}

.shape-card.active .shape-card-name { color:var(--accent,#40a882); }

.shape-card-desc {
  font-size:9px; letter-spacing:0.08em;
  color:var(--fg-low);
  text-align:center;
  line-height:1.6;
  transition:color 0.28s;
}

/* Active tick */
.shape-tick {
  position:absolute; top:10px; right:10px;
  width:18px; height:18px;
  border-radius:50%;
  background:var(--accent,#40a882);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.28s;
}
.shape-card.active .shape-tick { opacity:1; }
.shape-tick svg { width:10px; height:10px; stroke:#fff; stroke-width:2; }

/* Divider */
.panel-divider {
  height:1px;
  background:var(--border);
  margin: 0 24px 28px;
}

/* Theme row */
#theme-row {
  display:flex; justify-content:space-between; align-items:center;
}
#theme-row span { font-size:11px; letter-spacing:0.14em; color:var(--fg-mid); text-transform:uppercase; }

/* Toggle switch */
.toggle-wrap {
  display:flex; align-items:center; gap:10px;
}
.toggle-label { font-size:9px; letter-spacing:0.16em; color:var(--fg-low); text-transform:uppercase; }

.toggle {
  position:relative;
  width:42px; height:24px;
  border-radius:12px;
  background:var(--border-strong);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background 0.28s;
}
.toggle.on { background:var(--accent,#40a882); }
.toggle::after {
  content:'';
  position:absolute;
  top:3px; left:3px;
  width:18px; height:18px;
  border-radius:50%;
  background:#fff;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 1px 4px rgba(0,0,0,0.25);
}
.toggle.on::after { transform:translateX(18px); }

/* ─────────────────── VIGNETTE ─────────────────── */
#vignette {
  position:fixed; inset:0; pointer-events:none; z-index:10;
  background:radial-gradient(ellipse at center, transparent 42%, var(--vignette) 100%);
  transition:background var(--tt);
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
</style>
</head>
<body class="dark">

<div id="vignette"></div>

<!-- Settings overlay & panel -->
<div id="panel-overlay"></div>
<div id="settings-panel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <span class="panel-title">Display</span>
    <button id="panel-close">✕</button>
  </div>

  <div class="panel-section">
    <span class="section-label">Shape</span>
    <div id="shape-picker">

      <div class="shape-card active" data-shape="blob">
        <div class="shape-tick">
          <svg viewBox="0 0 10 10" fill="none"><polyline points="2,5 4.5,7.5 8,3"/></svg>
        </div>
        <canvas class="preview-canvas" data-preview="blob" width="64" height="64"></canvas>
        <div class="shape-card-name">Blob</div>
        <div class="shape-card-desc">Organic · alive<br>Default</div>
      </div>

      <div class="shape-card" data-shape="rings">
        <div class="shape-tick">
          <svg viewBox="0 0 10 10" fill="none"><polyline points="2,5 4.5,7.5 8,3"/></svg>
        </div>
        <canvas class="preview-canvas" data-preview="rings" width="64" height="64"></canvas>
        <div class="shape-card-name">Rings</div>
        <div class="shape-card-desc">Clean · glanceable<br>Treadmill</div>
      </div>

    </div>
  </div>

  <div class="panel-divider"></div>

  <div class="panel-section">
    <span class="section-label">Appearance</span>
    <div id="theme-row">
      <span>Light mode</span>
      <div class="toggle-wrap">
        <span class="toggle-label" id="theme-toggle-label">off</span>
        <div class="toggle" id="theme-toggle"></div>
      </div>
    </div>
  </div>

</div>

<!-- Main app -->
<div id="app">

  <div id="top">
    <div id="top-left">
      <div id="zone-label">Z2 · EASY</div>
      <div id="mouth-cue">in: nose · out: nose</div>
    </div>
    <button id="settings-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <div id="canvas-area">
    <div id="canvas-wrap">
      <canvas id="c"></canvas>
      <svg id="arc-svg">
        <circle id="arc-track"/>
        <circle id="arc-fill"/>
      </svg>
      <div id="breath-wrap">
        <div id="breath-verb">inhale</div>
        <div id="breath-detail">3 steps</div>
        <div id="phase-timer">3.5s</div>
      </div>
    </div>
  </div>

  <div id="bottom">
    <div id="zone-selector">
      <button class="zone-btn" data-zone="1"><span class="zn">Z1</span><span class="zt">rec</span></button>
      <button class="zone-btn active" data-zone="2"><span class="zn">Z2</span><span class="zt">easy</span></button>
      <button class="zone-btn" data-zone="3"><span class="zn">Z3</span><span class="zt">tempo</span></button>
      <button class="zone-btn" data-zone="4"><span class="zn">Z4</span><span class="zt">thresh</span></button>
      <button class="zone-btn" data-zone="5"><span class="zn">Z5</span><span class="zt">sprint</span></button>
    </div>

    <div id="hr-row">
      <span id="hr-label">HR</span>
      <input id="hr-slider" type="range" min="80" max="200" value="130" step="1">
      <span id="hr-value-display">— bpm</span>
      <button id="hr-clear">clr</button>
    </div>
  </div>

</div>

<script>
// ─── Zone data ────────────────────────────────────────────────────────────────
const ZONES = {
  1:{ label:'Z1 · RECOVERY', color:[80,130,160], color2:[40,80,120],
      inhale:4.2, exhale:4.2, inMouth:false, outMouth:false, steps:[4,4],
      noiseAmp:0.038, noiseSpeed:0.28, blobMin:0.51, blobMax:0.70, hrMin:0, hrMax:0.6 },
  2:{ label:'Z2 · EASY', color:[64,148,128], color2:[30,100,160],
      inhale:3.5, exhale:3.5, inMouth:false, outMouth:false, steps:[3,3],
      noiseAmp:0.062, noiseSpeed:0.50, blobMin:0.49, blobMax:0.72, hrMin:0.6, hrMax:0.7 },
  3:{ label:'Z3 · TEMPO', color:[185,155,60], color2:[200,90,40],
      inhale:2.5, exhale:2.5, inMouth:false, outMouth:true, steps:[2,2],
      noiseAmp:0.096, noiseSpeed:0.90, blobMin:0.47, blobMax:0.74, hrMin:0.7, hrMax:0.8 },
  4:{ label:'Z4 · THRESHOLD', color:[200,100,48], color2:[180,40,60],
      inhale:2.0, exhale:2.0, inMouth:true, outMouth:true, steps:[2,2],
      noiseAmp:0.145, noiseSpeed:1.45, blobMin:0.45, blobMax:0.76, hrMin:0.8, hrMax:0.9 },
  5:{ label:'Z5 · SPRINT', color:[188,50,50], color2:[220,80,20],
      inhale:1.2, exhale:1.0, inMouth:true, outMouth:true, steps:[1,1],
      noiseAmp:0.21, noiseSpeed:2.3, blobMin:0.43, blobMax:0.79, hrMin:0.9, hrMax:1.0 },
};

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let CS=0;

function resize(){
  const area=document.getElementById('canvas-area');
  CS=Math.min(area.clientWidth*0.90, area.clientHeight*0.90, 420);
  canvas.width=CS; canvas.height=CS;
  canvas.style.width=CS+'px'; canvas.style.height=CS+'px';
  initArc();
}

// ─── Arc ──────────────────────────────────────────────────────────────────────
const arcSVG=document.getElementById('arc-svg');
const arcTrack=document.getElementById('arc-track');
const arcFill=document.getElementById('arc-fill');
let arcC=0,arcR=0;

function initArc(){
  arcSVG.setAttribute('viewBox',`0 0 ${CS} ${CS}`);
  arcSVG.style.width=CS+'px'; arcSVG.style.height=CS+'px';
  arcR=CS*0.455; arcC=2*Math.PI*arcR;
  const cx=CS/2,cy=CS/2;
  [arcTrack,arcFill].forEach(el=>{
    el.setAttribute('cx',cx); el.setAttribute('cy',cy);
    el.setAttribute('r',arcR);
    el.style.strokeDasharray=arcC;
    el.style.strokeDashoffset=arcC;
  });
  arcFill.style.transformOrigin=`${cx}px ${cy}px`;
  arcFill.style.transform='rotate(-90deg)';
}
function setArc(p){ arcFill.style.strokeDashoffset=arcC*(1-p); }

// ─── Noise ────────────────────────────────────────────────────────────────────
const NV=90;
const s1=Array.from({length:NV},()=>Math.random()*800+100);
const s2=Array.from({length:NV},()=>Math.random()*800+100);
const _hc={};
function hsh(n){
  if(_hc[n]!==undefined)return _hc[n];
  const x=Math.sin(n*127.1+311.7)*43758.5453;
  return(_hc[n]=x-Math.floor(x));
}
function sn(t){const i=Math.floor(t),f=t-i,u=f*f*(3-2*f);return hsh(i)+u*(hsh(i+1)-hsh(i));}

// ─── Draw: BLOB ───────────────────────────────────────────────────────────────
function drawBlob(c2d,size,t,bsc,nAmp,nSpd,col,col2,light){
  const cx=size/2,cy=size/2,bR=size*bsc;
  const [r,g,b]=col,[r2,g2,b2]=col2;
  const glowR=bR*1.65;
  const glow=c2d.createRadialGradient(cx,cy,0,cx,cy,glowR);
  glow.addColorStop(0,`rgba(${r},${g},${b},0.09)`);
  glow.addColorStop(0.4,`rgba(${r},${g},${b},0.04)`);
  glow.addColorStop(0.7,`rgba(${r2},${g2},${b2},0.03)`);
  glow.addColorStop(1,`rgba(${r2},${g2},${b2},0)`);
  c2d.beginPath(); c2d.arc(cx,cy,glowR,0,Math.PI*2);
  c2d.fillStyle=glow; c2d.fill();
  const pts=[];
  for(let i=0;i<NV;i++){
    const a=(i/NV)*Math.PI*2;
    const n=(sn(s1[i]+t*nSpd*0.65)*0.62+sn(s2[i]+t*nSpd*1.28)*0.38)*2-1;
    const rd=bR*(1+n*nAmp);
    pts.push([cx+Math.cos(a)*rd,cy+Math.sin(a)*rd]);
  }
  function path(){
    c2d.beginPath();
    for(let i=0;i<pts.length;i++){
      const p0=pts[(i-1+pts.length)%pts.length],p1=pts[i];
      const p2=pts[(i+1)%pts.length],p3=pts[(i+2)%pts.length];
      if(i===0)c2d.moveTo(p1[0],p1[1]);
      c2d.bezierCurveTo(
        p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,
        p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,
        p2[0],p2[1]);
    }
    c2d.closePath();
  }
  path();
  const fill=c2d.createRadialGradient(cx-bR*0.12,cy-bR*0.18,0,cx+bR*0.08,cy+bR*0.08,bR*1.1);
  fill.addColorStop(0,  `rgba(${r},${g},${b},${light?0.72:0.58})`);
  fill.addColorStop(0.45,`rgba(${r},${g},${b},${light?0.50:0.36})`);
  fill.addColorStop(0.75,`rgba(${r2},${g2},${b2},${light?0.34:0.22})`);
  fill.addColorStop(1,  `rgba(${r2},${g2},${b2},${light?0.12:0.06})`);
  c2d.fillStyle=fill; c2d.fill();
  path();
  const rim=c2d.createLinearGradient(cx-bR,cy-bR,cx+bR,cy+bR);
  rim.addColorStop(0,`rgba(${r},${g},${b},0.55)`);
  rim.addColorStop(1,`rgba(${r2},${g2},${b2},0.28)`);
  c2d.strokeStyle=rim; c2d.lineWidth=1.2; c2d.stroke();
  const pulse=0.5+0.5*Math.sin(t*0.75);
  const iR=bR*(0.52+pulse*0.08),iX=cx-bR*0.04,iY=cy-bR*0.04;
  const inner=c2d.createRadialGradient(iX,iY,0,iX,iY,iR);
  inner.addColorStop(0,`rgba(${r},${g},${b},${light?0.24+pulse*0.10:0.18+pulse*0.08})`);
  inner.addColorStop(0.5,`rgba(${r},${g},${b},${light?0.07:0.05})`);
  inner.addColorStop(1,`rgba(${r},${g},${b},0)`);
  path(); c2d.save(); c2d.clip();
  c2d.beginPath(); c2d.arc(iX,iY,iR,0,Math.PI*2);
  c2d.fillStyle=inner; c2d.fill(); c2d.restore();
  const hlX=cx-bR*0.24,hlY=cy-bR*0.26,hlR=bR*0.13;
  c2d.beginPath(); c2d.arc(hlX,hlY,hlR,0,Math.PI*2);
  const hl=c2d.createRadialGradient(hlX,hlY,0,hlX,hlY,hlR);
  hl.addColorStop(0,`rgba(255,255,255,${light?0.38:0.13})`);
  hl.addColorStop(1,'rgba(255,255,255,0)');
  c2d.fillStyle=hl; c2d.fill();
}

// ─── Draw: RINGS ──────────────────────────────────────────────────────────────
function drawRings(c2d,size,t,bsc,nAmp,nSpd,col,col2,light){
  const cx=size/2,cy=size/2;
  const [r,g,b]=col,[r2,g2,b2]=col2;
  const maxR=size*bsc;
  const pulse=0.5+0.5*Math.sin(t*0.75);
  const numRings=4;
  for(let i=numRings;i>=1;i--){
    const frac=i/numRings;
    const ringR=maxR*frac;
    const rc=Math.round(r*frac+r2*(1-frac));
    const gc=Math.round(g*frac+g2*(1-frac));
    const bc=Math.round(b*frac+b2*(1-frac));
    const baseOp=light?(0.55-frac*0.35+(i===1?pulse*0.12:0)):(0.48-frac*0.30+(i===1?pulse*0.10:0));
    const wobble=1+sn(t*nSpd*0.6+i*200)*nAmp*0.5;
    c2d.beginPath(); c2d.arc(cx,cy,ringR*wobble,0,Math.PI*2);
    c2d.strokeStyle=`rgba(${rc},${gc},${bc},${baseOp})`;
    c2d.lineWidth=i===1?2.0:1.2; c2d.stroke();
    if(i===1){
      const grad=c2d.createRadialGradient(cx,cy,0,cx,cy,ringR*wobble);
      grad.addColorStop(0,`rgba(${r},${g},${b},${light?0.30+pulse*0.08:0.20+pulse*0.06})`);
      grad.addColorStop(0.6,`rgba(${r},${g},${b},${light?0.10:0.07})`);
      grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
      c2d.beginPath(); c2d.arc(cx,cy,ringR*wobble,0,Math.PI*2);
      c2d.fillStyle=grad; c2d.fill();
    }
  }
  const glow=c2d.createRadialGradient(cx,cy,maxR*0.8,cx,cy,maxR*1.8);
  glow.addColorStop(0,`rgba(${r},${g},${b},${light?0.06:0.05})`);
  glow.addColorStop(1,`rgba(${r2},${g2},${b2},0)`);
  c2d.beginPath(); c2d.arc(cx,cy,maxR*1.8,0,Math.PI*2);
  c2d.fillStyle=glow; c2d.fill();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function eio(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function lrp(a,b,t){return a+(b-a)*t;}
function lrpA(a,b,t){return a.map((v,i)=>lrp(v,b[i],t));}

// ─── App state ────────────────────────────────────────────────────────────────
let cz=2,phase='inhale',pp=0,time=0,lastTS=null;
let dCol=[...ZONES[2].color],dCol2=[...ZONES[2].color2];
let dNA=ZONES[2].noiseAmp,dNS=ZONES[2].noiseSpeed;
let dBmin=ZONES[2].blobMin,dBmax=ZONES[2].blobMax;
let dIn=ZONES[2].inhale,dEx=ZONES[2].exhale;
let isLight=false;
let currentShape='blob';

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const verbEl  =document.getElementById('breath-verb');
const detailEl=document.getElementById('breath-detail');
const timerEl =document.getElementById('phase-timer');
const labelEl =document.getElementById('zone-label');
const mouthEl =document.getElementById('mouth-cue');
let lastPhase='';

function updateCue(){
  if(phase===lastPhase)return;
  lastPhase=phase;
  const z=ZONES[cz];
  verbEl.style.opacity='0';
  setTimeout(()=>{
    const isIn=phase==='inhale';
    verbEl.textContent=isIn?'inhale':'exhale';
    const s=isIn?z.steps[0]:z.steps[1];
    detailEl.textContent=s>1?`${s} steps`:'fast';
    detailEl.style.opacity=cz>=5?'0':'1';
    verbEl.style.opacity='1';
  },100);
}

function setAccent(col){
  const[r,g,b]=col.map(Math.round);
  const c=`rgb(${r},${g},${b})`;
  document.documentElement.style.setProperty('--accent',c);
  arcFill.style.stroke=c;
}

// ─── Preview canvases (static thumbnails in panel) ────────────────────────────
function drawPreviews(){
  document.querySelectorAll('.preview-canvas').forEach(pc=>{
    const shape=pc.dataset.preview;
    const pctx=pc.getContext('2d');
    const s=pc.width;
    pctx.clearRect(0,0,s,s);
    const col=dCol.map(Math.round);
    const col2=dCol2.map(Math.round);
    if(shape==='blob') drawBlob(pctx,s,time,0.38,0.07,0.5,col,col2,isLight);
    if(shape==='rings') drawRings(pctx,s,time,0.38,0.07,0.5,col,col2,isLight);
  });
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTS)lastTS=ts;
  const dt=Math.min((ts-lastTS)/1000,0.08);lastTS=ts;
  time+=dt;
  const z=ZONES[cz],ls=dt*2.2,lss=dt*0.85;
  dCol =lrpA(dCol, z.color, ls);
  dCol2=lrpA(dCol2,z.color2,ls);
  dNA  =lrp(dNA,z.noiseAmp,ls);
  dNS  =lrp(dNS,z.noiseSpeed,ls);
  dBmin=lrp(dBmin,z.blobMin,ls);
  dBmax=lrp(dBmax,z.blobMax,ls);
  dIn  =lrp(dIn,z.inhale,lss);
  dEx  =lrp(dEx,z.exhale,lss);
  setAccent(dCol);
  const dur=phase==='inhale'?dIn:dEx;
  pp+=dt/dur;
  if(pp>=1){pp=0;phase=phase==='inhale'?'exhale':'inhale';}
  updateCue();
  timerEl.textContent=((1-pp)*dur).toFixed(1)+'s';
  setArc(pp);
  arcFill.style.opacity=phase==='inhale'?'0.72':'0.36';
  const bsc=lrp(
    phase==='inhale'?dBmin:dBmax,
    phase==='inhale'?dBmax:dBmin,
    eio(pp)
  );
  ctx.clearRect(0,0,CS,CS);
  if(currentShape==='blob')  drawBlob(ctx,CS,time,bsc,dNA,dNS,dCol,dCol2,isLight);
  if(currentShape==='rings') drawRings(ctx,CS,time,bsc,dNA,dNS,dCol,dCol2,isLight);
  // Update previews when panel is open
  if(document.getElementById('settings-panel').classList.contains('open')) drawPreviews();
}

// ─── Zone buttons ─────────────────────────────────────────────────────────────
function setZone(z){
  cz=z;
  const zd=ZONES[z];
  labelEl.textContent=zd.label;
  mouthEl.textContent=(zd.inMouth?'in: mouth':'in: nose')+' · '+(zd.outMouth?'out: mouth':'out: nose');
  document.querySelectorAll('.zone-btn').forEach(b=>{
    const active=parseInt(b.dataset.zone)===z;
    b.classList.toggle('active',active);
    if(active){
      const rip=document.createElement('div');
      rip.className='ripple';b.appendChild(rip);
      setTimeout(()=>rip.remove(),520);
    }
  });
  lastPhase='';
}
document.querySelectorAll('.zone-btn').forEach(b=>{
  b.addEventListener('click',()=>setZone(parseInt(b.dataset.zone)));
});

// ─── HR slider ────────────────────────────────────────────────────────────────
const slider   =document.getElementById('hr-slider');
const hrDisplay=document.getElementById('hr-value-display');
const hrClear  =document.getElementById('hr-clear');

function hrToZone(hr){
  const pct=hr/190;
  for(const z of[5,4,3,2,1]){if(pct>=ZONES[z].hrMin)return z;}
  return 1;
}
slider.addEventListener('input',()=>{
  const hr=parseInt(slider.value);
  hrDisplay.textContent=hr+' bpm';
  hrClear.classList.add('visible');
  setZone(hrToZone(hr));
});
hrClear.addEventListener('click',()=>{
  hrDisplay.textContent='— bpm';
  hrClear.classList.remove('visible');
});
slider.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

// ─── Settings panel ───────────────────────────────────────────────────────────
const panel   =document.getElementById('settings-panel');
const overlay =document.getElementById('panel-overlay');

function openPanel(){
  panel.classList.add('open');
  overlay.classList.add('open');
  drawPreviews();
}
function closePanel(){
  panel.classList.remove('open');
  overlay.classList.remove('open');
}

document.getElementById('settings-btn').addEventListener('click',openPanel);
document.getElementById('panel-close').addEventListener('click',closePanel);
overlay.addEventListener('click',closePanel);

// Swipe down to close
let touchStartY=0;
panel.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY;},{passive:true});
panel.addEventListener('touchmove',e=>{
  const dy=e.touches[0].clientY-touchStartY;
  if(dy>60)closePanel();
},{passive:true});

// ─── Shape selection ──────────────────────────────────────────────────────────
document.querySelectorAll('.shape-card').forEach(card=>{
  card.addEventListener('click',()=>{
    currentShape=card.dataset.shape;
    document.querySelectorAll('.shape-card').forEach(c=>c.classList.toggle('active',c===card));
    drawPreviews();
  });
});

// ─── Theme toggle ─────────────────────────────────────────────────────────────
const themeToggle=document.getElementById('theme-toggle');
const themeLabel =document.getElementById('theme-toggle-label');

themeToggle.addEventListener('click',()=>{
  isLight=!isLight;
  document.body.classList.toggle('dark',!isLight);
  document.body.classList.toggle('light',isLight);
  themeToggle.classList.toggle('on',isLight);
  themeLabel.textContent=isLight?'on':'off';
  document.getElementById('theme-meta').content=isLight?'#ece9e3':'#07090c';
});

// ─── Init ─────────────────────────────────────────────────────────────────────
resize();
window.addEventListener('resize',resize);
setZone(2);
requestAnimationFrame(loop);
</script>
</body>
